[package]
name = "ahdclient-desktop"
version = "2.7.0"
edition = "2021"
description = "A House Divided desktop client: the real game, run locally"
authors = ["Lakeside Games"]
publish = false
license-file = "../../../LICENSE.md"
repository = "https://github.com/lakesidegamedev/AHDClient"
rust-version = "1.77.2"

[lib]
name = "ahdclient_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-briefing-widgets = { path = "plugins/briefing-widgets" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

# Desktop only: the local game process, its dialogs and file access, and the
# signed updater. Android and iOS build the launcher plus the live site alone.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
flate2 = "1"
fs2 = "0.4"
tar = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
