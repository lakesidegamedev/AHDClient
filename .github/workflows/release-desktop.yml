name: desktop bundles

on:
  workflow_dispatch:
    inputs:
      game_ref:
        description: AHDGame branch, tag or commit to bundle instead of game-ref.json (test builds only)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  game-ref:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A tagged release must ship a game that is on main and recent. A manual
      # run with game_ref is a test build and skips the freshness rule.
      - id: pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GAME_REF_INPUT: ${{ inputs.game_ref }}
        run: |
          if [ -n "$GAME_REF_INPUT" ]; then
            echo "commit=$GAME_REF_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$(node scripts/game-ref.mjs --fresh)" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: game-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm
            artifact: ahdclient-linux-x86_64
            paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            artifact: ahdclient-windows-x86_64
            paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact: ahdclient-macos-aarch64
            paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            artifact: ahdclient-macos-x86_64
            paths: |
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          grep -RIlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d | sudo xargs -0r rm -f
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test --workspace apps/desktop

      - name: Check out the game
        uses: actions/checkout@v4
        with:
          repository: lakesidegamedev/AHDGame
          ref: ${{ needs.game-ref.outputs.commit }}
          path: vendor/AHDGame
      - name: Stage Node and the game build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: "1"
        run: node scripts/prepare-game.mjs --target ${{ matrix.target }} --game-dir vendor/AHDGame
      # The bundled game must start a fresh 2027 world, process turns, save,
      # stop and reopen on this OS before it ships. Intel macOS is built on an
      # Apple Silicon runner, so its game is proven by the arm64 job.
      - name: Smoke the bundled singleplayer game
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          AHD_SMOKE_TIMINGS: ${{ github.workspace }}/smoke-timings.json
        # Run the game's own smoke against the exact staged bytes the app ships.
        run: |
          rm -rf vendor/AHDGame/dist/singleplayer
          cp -R apps/desktop/src-tauri/resources/game vendor/AHDGame/dist/singleplayer
          node vendor/AHDGame/scripts/singleplayer/smoke.mjs
          rm -rf vendor/AHDGame/dist/singleplayer
      - name: Upload smoke timings
        if: always() && matrix.target != 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-timings-${{ matrix.artifact }}
          path: smoke-timings.json
          if-no-files-found: ignore
      - name: Verify Windows Node entry paths
        if: matrix.platform == 'windows-latest'
        run: |
          npm run build:web --workspace apps/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml node_path
      # Developer ID signing and notarization turn on when the APPLE_CERTIFICATE
      # secret (base64 .p12) exists. Without it the app is ad-hoc signed.
      - name: Choose macOS signing mode
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing enabled"
            # Only export the certificate when it exists: Tauri tries to import
            # any APPLE_CERTIFICATE it sees, even an empty one.
            {
              echo "APPLE_CERTIFICATE<<AHD_CERT_EOF"
              printf '%s\n' "$APPLE_CERTIFICATE"
              echo "AHD_CERT_EOF"
              echo "APPLE_CERTIFICATE_PASSWORD<<AHD_PW_EOF"
              printf '%s\n' "$APPLE_CERTIFICATE_PASSWORD"
              echo "AHD_PW_EOF"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY_CONTENT" ]; then
              key="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
              chmod 600 "$key"
              echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
            else
              echo "::warning::APPLE_API_KEY_CONTENT missing, build will be signed but not notarized"
            fi
          else
            echo "No APPLE_CERTIFICATE, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Verify packaged macOS Node runtime
        if: startsWith(matrix.platform, 'macos')
        run: |
          archive=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          test -n "$archive"
          extract="$RUNNER_TEMP/ahd-mac-smoke-${{ matrix.target }}"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          node=$(find "$extract" -type f -path '*.app/Contents/MacOS/ahd-node' -print -quit)
          test -x "$node"
          codesign --verify --deep --strict "$extract"/*.app
          "$node" -e "for (let i = 0; i < 100000; i++) Math.sqrt(i); console.log('ahd-node-jit-ok')" | grep -q ahd-node-jit-ok

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
