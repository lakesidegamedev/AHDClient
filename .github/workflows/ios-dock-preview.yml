name: ios dock preview

# Fast loop for the mobile dock: typecheck the SwiftUI sources against the iOS
# SDK, build a bare harness app around them and screenshot it on simulators.
# The full app build lives in release-mobile.yml and takes much longer.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/plugins/briefing-widgets/ios/**"
      - ".github/ios-dock-harness/**"
      - ".github/scripts/ios-dock-screens.sh"
      - ".github/workflows/ios-dock-preview.yml"
  push:
    branches: [feat/mobile-dock-ios]
    paths:
      - "apps/desktop/src-tauri/plugins/briefing-widgets/ios/**"
      - ".github/ios-dock-harness/**"
      - ".github/scripts/ios-dock-screens.sh"
      - ".github/workflows/ios-dock-preview.yml"

permissions:
  contents: read

concurrency:
  group: ios-dock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dock:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Typecheck the dock sources
        run: |
          d=apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" $d/BriefingStore.swift $d/NativeNav.swift $d/NativeDock.swift $d/FoundationModelBridge.swift $d/NativeAsk*.swift
      - name: Screenshot the dock
        run: bash .github/scripts/ios-dock-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-dock-screens
          path: dock-screens/
          if-no-files-found: ignore
