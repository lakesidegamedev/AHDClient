name: mobile bundles

# Android APK and AAB on Linux; iOS on macOS. Both jobs also run on pull
# requests that touch the client so the mobile targets cannot silently rot.
# Store signing is optional: with no secrets the Android bundle is unsigned
# and iOS builds for the simulator, which still proves the native compile.

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed iOS IPA to TestFlight
        required: false
        default: false
        type: boolean
      ios_runner:
        description: macOS image for the iOS job (Intel only if it has Xcode 26)
        required: false
        default: macos-latest
        type: choice
        options: [macos-latest, macos-15-intel]
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release-mobile.yml"
      - "apps/desktop/**"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test --workspace apps/desktop

      - name: Generate native app icons
        run: |
          npm run tauri --workspace apps/desktop -- icon src/assets/ahd-logo.png --ios-color '#ffffff'
          test -s apps/desktop/src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG" > apps/desktop/src-tauri/gen/android/app/google-services.json
          fi
      - name: Install the upload keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: building unsigned."
            exit 0
          fi
          dir=apps/desktop/src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "keyAlias=upload"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > "$dir/keystore.properties"

      - name: Build the APK and the Play bundle
        env:
          # Pull request builds are never signed or shipped; they carry the dock
          # screenshot link the launch job uses. Tag and dispatch builds do not.
          AHD_DOCK_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run tauri --workspace apps/desktop -- android build --apk --aab

      # Pure Kotlin tests (status figures, countdown wording) run on the JVM.
      - name: Android unit tests
        working-directory: apps/desktop/src-tauri/gen/android
        run: ./gradlew --no-daemon :app:testUniversalReleaseUnitTest

      - name: Verify 16 KB page alignment
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          python3 scripts/verify-android-16k-pages.py "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ahdclient-android
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: error

  # The release APK must survive launch on stock Android. Minified release
  # builds once shipped without a JNI method (R8) and crashed on every device
  # (ticket 1387) while debug builds were fine.
  android-launch:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ahdclient-android
          path: android-artifact
      - run: cp "$(find android-artifact -name '*.apk' -print -quit)" app.apk && ls -l app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Then walk the player's sign-in path: a UI-thread deadlock there
          # froze the app on Continue with Discord (ticket 1450).
          script: |
            bash .github/scripts/android-launch-check.sh
            bash .github/scripts/android-signin-walk.sh
            bash .github/scripts/android-ask-screens.sh
            bash .github/scripts/android-dock-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-${{ matrix.api }}
          path: probe/
          if-no-files-found: ignore

  ios:
    # Hosted arm64 macOS can run out of capacity ("not acquired by Runner");
    # a manual dispatch can pick the Intel image instead.
    runs-on: ${{ inputs.ios_runner || 'macos-latest' }}
    env:
      # App Store Connect needs a new CFBundleVersion for every upload of the
      # same app version. Set before `ios init` so the widget extension, which
      # copies the app's value, matches it. At most three integers, so the run
      # number stands alone rather than being appended to the version.
      TAURI_CONFIG: '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects uploads built with an SDK older than iOS 26
      # (Xcode 26). Pick the newest installed Xcode 26 and stop early when the
      # image has none, instead of failing at upload after a full build.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "No Xcode 26 on this runner image; App Store uploads need the iOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # TestFlight builds compile from scratch: a restored cache once shipped a
      # stale compiled Swift plugin (2.3.19 build 8).
      - uses: Swatinem/rust-cache@v2
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload_testflight) }}
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck

      - name: Generate the Xcode project
        env:
          # The Tauri CLI refuses to generate a project without a team id. A
          # placeholder is fine for the unsigned simulator build; the real
          # team arrives with the App Store secrets.
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}
        run: |
          if [ ! -d apps/desktop/src-tauri/gen/apple ]; then
            npm run tauri --workspace apps/desktop -- ios init --ci
          fi
          ls apps/desktop/src-tauri/gen/apple

      - name: Add the WidgetKit extension
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}
        run: ruby scripts/configure-ios-widgets.rb

      - name: Check the push entitlement in the Xcode project
        run: python3 scripts/check-ios-push-project.py

      - name: Check widget Swift sources
        run: |
          swift package --package-path apps/desktop/src-tauri/plugins/briefing-widgets/ios dump-package > /dev/null
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -typecheck -parse-as-library -application-extension -swift-version 5 \
            -target arm64-apple-ios15.0-simulator -sdk "$sdk" \
            apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/BriefingStore.swift \
            apps/desktop/src-tauri/ios-widgets/AHDWidgets.swift

      - name: Check native push Swift sources
        run: |
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/BriefingStore.swift apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/NativePush.swift apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/NativeAlerts.swift
      - name: Check native Ask Swift sources
        run: |
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/FoundationModelBridge.swift apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources/NativeAsk*.swift
      - name: Dock core tests (real /api/mobile-dock payloads)
        run: |
          d=apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources
          xcrun swiftc -swift-version 5 -o "$RUNNER_TEMP/dock-core-test" $d/BriefingStore.swift $d/NativeDockLayout.swift $d/NativeDockCore.swift .github/dock-core-test/main.swift
          "$RUNNER_TEMP/dock-core-test" apps/desktop/src/dockFixtures
      - name: Check native dock Swift sources
        run: |
          d=apps/desktop/src-tauri/plugins/briefing-widgets/ios/Sources
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" $d/BriefingStore.swift $d/NativeNav.swift $d/NativeQuickActions.swift $d/NativeLinks.swift $d/NativeLoad.swift $d/NativeAlerts.swift $d/NativeDock*.swift $d/FoundationModelBridge.swift $d/NativeAsk*.swift
      - name: Generate native app icons
        run: |
          npm run tauri --workspace apps/desktop -- icon src/assets/ahd-logo.png --ios-color '#ffffff'
          icon=apps/desktop/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          test -s "$icon"
          sips -s format jpeg "$icon" --out "$RUNNER_TEMP/AHDClient-app-icon.jpg"
          sips -s format png "$RUNNER_TEMP/AHDClient-app-icon.jpg" --out "$icon"
          sips -g hasAlpha "$icon" | grep -q 'hasAlpha: no'

      - name: Decide how to sign
        id: signing
        env:
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight || false }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          # Signing runs only for an explicit TestFlight dispatch. The team is the
          # Lakeside organization account, so the signing identity is no longer
          # personal; signed IPAs are still never kept as artifacts and Apple
          # tool output is still discarded by private-apple-command.py.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$UPLOAD_TESTFLIGHT" = "true" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo "$APPLE_API_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
            echo "mode=store" >> "$GITHUB_OUTPUT"
          else
            echo "No App Store Connect signing secrets: building for the simulator."
            echo "mode=simulator" >> "$GITHUB_OUTPUT"
          fi

      # Automatic signing only adds aps-environment to the App Store profile
      # when the App ID has the capability; without it every device fails
      # registerForRemoteNotifications. Prints capability names only.
      - name: Enable Push Notifications and Associated Domains on the App ID
        if: steps.signing.outputs.mode == 'store'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet --disable-pip-version-check 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc/bin/python" scripts/ensure-ios-push-capability.py

      - name: Build the App Store archive
        if: steps.signing.outputs.mode == 'store'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: python3 scripts/private-apple-command.py npm run tauri --workspace apps/desktop -- ios build --export-method app-store-connect

      - name: Verify widget sharing in the signed IPA
        if: steps.signing.outputs.mode == 'store'
        run: |
          ipa=$(find apps/desktop/src-tauri/gen/apple/build/arm64 -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          python3 scripts/verify-ios-widget-bundle.py "$ipa"

      - name: Verify the push entitlement in the signed IPA
        if: steps.signing.outputs.mode == 'store'
        run: |
          # The archive's own signature, before export re-signs it. Key only.
          archive=$(find apps/desktop/src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit)
          if [ -n "$archive" ]; then
            app=$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
            printf 'archive aps-environment: '
            codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -extract aps-environment raw -o - - 2>/dev/null || echo None
          fi
          ipa=$(find apps/desktop/src-tauri/gen/apple/build/arm64 -type f -name '*.ipa' -print -quit)
          python3 scripts/verify-ios-push-entitlement.py "$ipa"
          python3 scripts/verify-ios-source-markers.py "$ipa"

      # Signed builds exist only for an explicit TestFlight upload. They are
      # never retained as GitHub artifacts because Apple embeds the account
      # identity in the distribution certificate and provisioning profiles.
      - name: Upload the signed IPA to TestFlight
        if: >-
          steps.signing.outputs.mode == 'store' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_testflight
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ipa=$(find apps/desktop/src-tauri/gen/apple/build/arm64 -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          cp "$APPLE_API_KEY_PATH" "$key_dir/AuthKey_${APPLE_API_KEY}.p8"
          python3 scripts/private-apple-command.py xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove signed iOS material
        if: always() && steps.signing.outputs.mode == 'store'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          shutil.rmtree(Path('apps/desktop/src-tauri/gen/apple/build'), ignore_errors=True)
          shutil.rmtree(Path.home() / '.appstoreconnect/private_keys', ignore_errors=True)
          key = Path(os.environ.get('APPLE_API_KEY_PATH', '/nonexistent'))
          if key.exists():
              key.unlink()
          PY

      - name: Build for the simulator (unsigned)
        if: steps.signing.outputs.mode == 'simulator'
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX
        run: |
          npm run tauri --workspace apps/desktop -- ios build --help
          npm run tauri --workspace apps/desktop -- ios build --ci --target aarch64-sim --no-sign
          find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -name '*.app' -print
          app=$(find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -name '*.app' -print -quit)
          plutil -lint "$app/PrivacyInfo.xcprivacy"

      - name: Screenshot Ask on iPhone and iPad
        if: steps.signing.outputs.mode == 'simulator'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          app=$(find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -name '*.app' -print -quit)
          bash .github/scripts/ios-ask-screens.sh "$app"

      - name: Screenshot the dock on iPhone and iPad
        if: steps.signing.outputs.mode == 'simulator'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          app=$(find apps/desktop/src-tauri/gen/apple/build -maxdepth 3 -name '*.app' -print -quit)
          bash .github/scripts/ios-dock-app-screens.sh "$app"

      - name: Upload dock screenshots
        if: steps.signing.outputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-dock-app-screens
          path: ios-dock-app-screens/
          if-no-files-found: ignore

      - name: Render the home-screen widgets
        if: steps.signing.outputs.mode == 'simulator'
        continue-on-error: true
        timeout-minutes: 10
        run: bash .github/scripts/ios-widget-render.sh

      - name: Upload widget renders
        if: steps.signing.outputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-widget-renders
          path: widget-renders/
          if-no-files-found: ignore

      - name: Upload Ask screenshots
        if: steps.signing.outputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ask-screens
          path: ios-screens/
          if-no-files-found: ignore

      # Best effort: an unsigned device build that Sideloadly or AltStore can
      # sign with a free Apple ID for on-device testing before the developer
      # membership and the App Store listing exist.
      - name: Build the unsigned device IPA
        if: steps.signing.outputs.mode == 'simulator'
        continue-on-error: true
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX
        run: |
          npm run tauri --workspace apps/desktop -- ios build --ci --target aarch64 --no-sign --archive-only
          app=$(find apps/desktop/src-tauri/gen/apple/build -type d -path '*.xcarchive/Products/Applications/*.app' | head -n1)
          test -n "$app"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/AHDClient-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/AHDClient-unsigned.ipa"
          python3 scripts/verify-ios-source-markers.py "$GITHUB_WORKSPACE/AHDClient-unsigned.ipa"

      - name: Upload the unsigned device IPA
        if: steps.signing.outputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ahdclient-ios-unsigned-ipa
          path: AHDClient-unsigned.ipa
          if-no-files-found: warn

      - name: Upload the simulator app
        if: steps.signing.outputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ahdclient-ios-simulator
          path: apps/desktop/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
